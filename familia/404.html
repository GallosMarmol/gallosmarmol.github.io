<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Página no encontrada · Gallos Mármol</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="La página que buscas no existe en Gallos Mármol. Vuelve al catálogo o explora nuestras secciones.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Página no encontrada · Gallos Mármol">
<meta property="og:description" content="La página que buscas no existe.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="/shared/assets/favicon.png">
<link rel="stylesheet" href="../shared/css/shared.css">
<link rel="stylesheet" href="./assets/css/public.css">

<style>
  /* ============================================================
     404 — Estilos locales
     Fondo blanco · Logo centrado · Card central · Grid de enlaces
     ============================================================ */

  body.page-404 {
    background: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .page-404 main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  @media (min-width: 640px) {
    .page-404 main {
      padding: 60px 28px 80px;
    }
  }

  .not-found-wrap {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
  }

  /* === Logo === */
  .not-found-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
    animation: notFoundFade .5s ease both;
  }

  .not-found-logo-img {
    max-width: 180px;
    height: auto;
    display: block;
  }

  @media (min-width: 640px) {
    .not-found-logo-img {
      max-width: 220px;
    }
  }

  /* === Código 404 === */
  .not-found-code {
    font-family: var(--font-display, 'Fraunces', serif);
    font-size: clamp(64px, 14vw, 110px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
    color: var(--brand-primary, #6b0000);
    margin: 0 0 8px;
    animation: notFoundFade .5s ease .05s both;
  }

  /* === Título === */
  .not-found-title {
    font-family: var(--font-display, 'Fraunces', serif);
    font-size: clamp(22px, 3.5vw, 30px);
    font-weight: 600;
    line-height: 1.2;
    color: var(--text-main, #1a1210);
    margin: 0 0 10px;
    letter-spacing: -.01em;
    animation: notFoundFade .5s ease .1s both;
  }

  /* === Texto === */
  .not-found-text {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text-muted, #6e6559);
    max-width: 44ch;
    margin: 0 auto 26px;
    animation: notFoundFade .5s ease .15s both;
  }

  @media (min-width: 640px) {
    .not-found-text {
      font-size: 15.5px;
    }
  }

  /* === Botones === */
  .not-found-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    margin-bottom: 40px;
    animation: notFoundFade .5s ease .2s both;
  }

  @media (min-width: 480px) {
    .not-found-actions {
      flex-direction: row;
      flex-wrap: wrap;
    }
  }

  .not-found-actions .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 8px;
    min-height: 46px;
    text-decoration: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
    cursor: pointer;
  }

  .not-found-actions .btn:active {
    transform: translateY(1px);
  }

  .not-found-actions .btn:focus-visible {
    outline: 2px solid var(--brand-primary, #6b0000);
    outline-offset: 3px;
  }

  .not-found-actions .btn-primary {
    background: var(--brand-primary, #6b0000);
    color: #ffffff;
    border: 1px solid var(--brand-primary, #6b0000);
  }

  .not-found-actions .btn-primary:hover {
    background: #4d0000;
    border-color: #4d0000;
  }

  .not-found-actions .btn-ghost {
    background: #ffffff;
    color: var(--brand-primary, #6b0000);
    border: 1px solid #e6dfd1;
  }

  .not-found-actions .btn-ghost:hover {
    border-color: var(--brand-primary, #6b0000);
    background: rgba(107, 0, 0, .04);
  }

  /* === Quizás buscabas === */
  .not-found-suggestions {
    border-top: 1px solid #e6dfd1;
    padding-top: 26px;
    animation: notFoundFade .5s ease .25s both;
  }

  .not-found-suggestions-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted, #6e6559);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: 0 0 14px;
  }

  .not-found-suggestions-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  @media (min-width: 640px) {
    .not-found-suggestions-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
  }

  .not-found-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 12px;
    background: #ffffff;
    border: 1px solid #e6dfd1;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text-main, #1a1210);
    font-size: 13px;
    font-weight: 600;
    transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }

  .not-found-link:hover {
    border-color: var(--brand-primary, #6b0000);
    background: rgba(107, 0, 0, .03);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -14px rgba(107, 0, 0, .3);
  }

  .not-found-link:focus-visible {
    outline: 2px solid var(--brand-primary, #6b0000);
    outline-offset: 3px;
  }

  .not-found-link-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(107, 0, 0, .07);
    color: var(--brand-primary, #6b0000);
  }

  .not-found-link-icon svg {
    width: 18px;
    height: 18px;
  }

  /* === Animación === */
  @keyframes notFoundFade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .not-found-logo,
    .not-found-code,
    .not-found-title,
    .not-found-text,
    .not-found-actions,
    .not-found-suggestions {
      animation: none !important;
    }
    .not-found-link {
      transition: none;
    }
  }

  /* === Noscript === */
  .noscript-warn {
    max-width: 640px;
    margin: 40px auto;
    padding: 20px;
    background: #fef3f2;
    border: 1px solid #f5c2c0;
    border-radius: 8px;
    color: #a63d33;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body class="page-404" data-linea="catalogo">

              <polygon points="12 2 2 7 12 12 22 7 12 2"/>

          <span>Catálogo</span>

              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>

          </span>
          <span>Outlet</span>

              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <line x1="7" y1="7" x2="7.01" y2="7"/>

      </div>
    </div>

  </div>
</main>


<script src="../shared/js/shared.js"></script>
<script src="./assets/js/pub-shell.js"></script>

</html>
