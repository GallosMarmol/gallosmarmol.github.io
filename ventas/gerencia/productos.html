<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Productos · Gerencia · Gallos Mármol</title>
  <meta name="description" content="Consulta del catálogo de productos">
  <link rel="stylesheet" href="/shared/css/shared.css">
  <link rel="stylesheet" href="/ventas/assets/css/ventas.css">
</head>
<body data-rol="gerencia">

  <div class="ventas-layout">
    <aside class="v-sidebar" id="v-sidebar"></aside>
    <div class="v-main">
      <header class="v-topbar">
        <div class="v-topbar-left">
          <div class="v-crumb" id="v-crumb">Catálogo / Productos</div>
          <h1 class="v-title" id="v-title">Productos</h1>
        </div>
        <div class="v-topbar-right" id="v-topbar-right"></div>
      </header>
      <div class="v-content" id="v-content">
        <div class="v-empty">
          <div class="v-empty-icon">⋯</div>
          <div class="v-empty-text">Cargando…</div>
        </div>
      </div>
    </div>
  </div>

  <!--
    NOTA: Gerencia es SOLO LECTURA de productos.
    El productos.js oculta automáticamente:
      - Botón "+ Nuevo producto"
      - Botón ✎ Editar en cada fila
      - Botón 🗑 Eliminar
      - Modal de crear/editar (no se renderiza)
      - Checkboxes de líneas
      - Botón "Editar producto" en el drawer
    Y muestra:
      - Tabla completa con todos los productos
      - Chips de líneas (Catálogo, Outlet, Saldos)
      - Filtros (familia, línea, activo)
      - Búsqueda por SKU/nombre
      - Drawer de detalle con imágenes, precio, especificaciones
      - WhatsApp / Imprimir / Copiar SKU en el drawer
    Es útil para que gerencia consulte el catálogo sin modificarlo.
    Es IDÉNTICO a asesor/productos.html, salvo el data-rol.
  -->

  <script src="/shared/js/shared.js"></script>
  <script type="module" src="/ventas/assets/js/productos.js"></script>
</body>
</html>
