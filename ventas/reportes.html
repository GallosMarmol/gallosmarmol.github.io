<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reportes de ventas · Gallos Mármol</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared/css/shared.css">
<style>
  #gm-burger{display:none;}
  @media (max-width:880px){ #gm-burger{display:inline-flex;} }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="gm-sidebar"></aside>
  <div class="app-main">
    <header class="app-topbar" id="gm-topbar"></header>
    <main class="app-content" id="gm-content"></main>
  </div>
</div>
<script src="../../shared/js/mock-data.js"></script>
<script src="../../shared/js/shared.js"></script>
<script src="../../shared/js/nav.js"></script>
<script src="../../shared/js/list-page.js"></script>
<script>
gmListPage({
  portal: "ventas",
  active: "reportes",
  title: "Reportes de ventas",
  crumb: "Análisis",
  base: "../",
  dbKey: "pedidos",
  searchPlaceholder: "Buscar…",
  subtitle: "Reporte base de ventas del periodo. (En la versión completa: exportable a Excel/PDF y con filtros por vendedor, línea y sede.)",
  idField: null,
  addLabel: null,
  addFields: null,
  columns: [{key:'id',label:'Pedido',mono:true},{key:'cliente',label:'Cliente'},{key:'fecha',label:'Fecha',mono:true},{key:'total',label:'Monto',render:r=>GM.soles(r.total)},{key:'estadoPago',label:'Estado pago',render:r=>GM.badge(r.estadoPago, GM.estadoTone(r.estadoPago))}]
});
</script>
</body>
</html>
