<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Ventas · Gallos Mármol</title>
  <link rel="stylesheet" href="../shared/css/shared.css">
</head>
<body>
  <div id="cargando" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;">
    <div style="text-align:center;">
      <div style="font-size:2rem;margin-bottom:1rem;">⏳</div>
      <p style="color:#666;">Verificando permisos...</p>
    </div>
  </div>

  <div id="contenido" style="display:none;max-width:1180px;margin:0 auto;padding:2rem;">
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #e0e0e0;">
      <div>
        <div style="font-family:var(--font-display);font-size:1.5rem;color:#6b0000;font-weight:600;">Gallos Mármol</div>
        <div style="font-size:0.875rem;color:#666;">Portal de Ventas</div>
      </div>
      <button id="logout-btn" style="background:transparent;border:1px solid #ccc;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;font-family:inherit;">
        Cerrar sesión
      </button>
    </header>

    <h1 style="font-size:1.75rem;margin-bottom:1rem;">Bienvenido al Portal de Ventas</h1>

    <div id="user-info" style="background:#f8f8f8;padding:1.25rem;border-radius:8px;margin-bottom:2rem;line-height:1.8;">
    </div>

    <div style="background:#fff3cd;padding:1rem;border-radius:8px;border-left:4px solid #b8860b;">
      <strong>📌 Próximos pasos:</strong>
      <ul style="margin:0.5rem 0 0 1.25rem;padding:0;">
        <li>Módulo de Leads (CRUD)</li>
        <li>Módulo de Cotizaciones</li>
        <li>Módulo de Clientes</li>
        <li>Refactorizar nav.js para menú dinámico</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import { protegerPagina } from '../shared/js/guard.js';
    import { Auth } from '../shared/js/auth.js';

    try {
      const usuario = await protegerPagina({
        roles: ['ventas', 'admin']
      });

      if (!usuario) throw new Error('No autorizado');

      document.getElementById('cargando').style.display = 'none';
      document.getElementById('contenido').style.display = 'block';

      document.getElementById('user-info').innerHTML = `
        <strong>👤 ${usuario.perfil.nombre} ${usuario.perfil.apellido}</strong><br>
        📧 ${usuario.perfil.email}<br>
        🎭 Rol: <strong>${usuario.perfil.rol_nombre}</strong><br>
        🔑 Permisos: <strong>${usuario.permisos.length}</strong> (${usuario.permisos.slice(0, 3).join(', ')}${usuario.permisos.length > 3 ? '...' : ''})
      `;

      document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());

    } catch (error) {
      console.error('Error:', error);
      document.getElementById('cargando').innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
    }
  </script>
</body>
</html>
