<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · Asesor · Gallos Mármol</title>
  <meta name="description" content="Panel personal del asesor comercial">
  <link rel="stylesheet" href="/shared/css/shared.css">
  <link rel="stylesheet" href="/ventas/assets/css/ventas.css">
</head>
<body data-rol="asesor">

  <div class="ventas-layout">
    <aside class="v-sidebar" id="v-sidebar"></aside>
    <div class="v-main">
      <header class="v-topbar">
        <div class="v-topbar-left">
          <div class="v-crumb" id="v-crumb">Ventas / Asesor</div>
          <h1 class="v-title" id="v-title">Dashboard</h1>
        </div>
        <div class="v-topbar-right" id="v-topbar-right"></div>
      </header>
      <div class="v-content" id="v-content">
        <div class="v-empty">
          <div class="v-empty-icon">⋯</div>
          <div class="v-empty-text">Cargando KPIs…</div>
        </div>
      </div>
    </div>
  </div>

  <!--
    NOTA: El asesor ve solo SUS leads.
    KPIs orientados a "qué hago hoy":
      - Mis leads (total)
      - Nuevos (para contactar)
      - Contactados (en seguimiento)
      - Convertidos (logros)
      - Tasa de conversión
      - Seguimientos pendientes hoy
    Acciones rápidas:
      - Ver mis leads
      - Nuevo lead
    Tabla:
      - Sus últimos leads (para retomar contexto)
  -->

  <script src="/shared/js/shared.js"></script>
  <script type="module" src="/ventas/assets/js/dashboard-asesor.js"></script>
</body>
</html>
