<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso al sistema de gestión de Gallos Mármol">
  <meta name="robots" content="noindex">
  <title>Iniciar sesión · Gallos Mármol</title>
  <link rel="icon" type="image/png" href="/shared/assets/favicon.png">
  <link rel="stylesheet" href="../shared/css/shared.css">
  <style>
    /* ============================================================
       LOGIN — Estilos locales
       Fondo blanco plano · Card limpia · Inputs con icono
       ============================================================ */

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: 'Poppins', sans-serif;
      color: var(--text-main, #1a1210);
      -webkit-font-smoothing: antialiased;
    }

    /* === Layout principal === */
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
    }

    @media (min-width: 640px) {
      .login-page {
        padding: 2rem;
      }
    }

    /* === Card === */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #6b0000;
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 40px -24px rgba(107, 0, 0, .18);
    }

    @media (min-width: 640px) {
      .login-card {
        padding: 2.25rem 2rem;
      }
    }

    /* === Logo === */
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .login-logo-img {
      max-width: 150px;
      height: auto;
      display: block;
    }

    @media (min-width: 640px) {
      .login-logo-img {
        max-width: 120px;
      }
    }

    /* === Título === */
    .login-title {
      font-family:'Poppins', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      margin: 0 0 0.35rem;
      color: var(--text-main, #1a1210);
      letter-spacing: -.01em;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-muted, #6e6559);
      font-size: 0.875rem;
      margin: 0 0 1.5rem;
      line-height: 1.5;
    }

    /* === Form === */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* === Campo === */
    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main, #1a1210);
    }

    .field-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #6b0000;
      pointer-events: none;
      opacity: .65;
      z-index: 1;
      flex-shrink: 0;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid #e6dfd1;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      color: var(--text-main, #1a1210);
      background: #ffffff;
      transition: border-color .15s ease, box-shadow .15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    @media (min-width: 640px) {
      .login-input {
        padding: 11px 14px 11px 42px;
        font-size: 14px;
      }
    }

    .login-input::placeholder {
      color: #b8b0a0;
    }

    .login-input:hover {
      border-color: #d4cdbc;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--brand-primary, #6b0000);
      box-shadow: 0 0 0 3px rgba(107, 0, 0, .08);
    }

    .login-input.input-error {
      border-color: var(--danger, #a63d33);
      background: rgba(166, 61, 51, .03);
    }

    /* Padding extra a la derecha cuando hay toggle de contraseña */
    .login-input.has-toggle {
      padding-right: 46px;
    }

    /* === Toggle de contraseña === */
    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--text-muted, #6e6559);
      cursor: pointer;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease, color .15s ease;
    }

    .password-toggle:hover {
      background: rgba(107, 0, 0, .06);
      color: var(--brand-primary, #6b0000);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--brand-primary, #6b0000);
      outline-offset: 2px;
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #6b0000;
    }

    .password-toggle .icon-eye-off {
      display: none;
    }

    .password-toggle.is-visible .icon-eye {
      display: none;
    }

    .password-toggle.is-visible .icon-eye-off {
      display: block;
    }

    /* === Botón === */
    .login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 18px;
      margin-top: 6px;
      background: var(--brand-primary, #6b0000);
      color: #ffffff;
      border: 1px solid var(--brand-primary, #6b0000);
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
      transition: background .15s ease, border-color .15s ease, transform .1s ease;
    }

    @media (min-width: 640px) {
      .login-btn {
        min-height: 44px;
        font-size: 14px;
      }
    }

    .login-btn:hover:not(:disabled) {
      background: #4d0000;
      border-color: #4d0000;
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .login-btn .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* === Mensaje de error === */
    .error-msg {
      color: var(--danger, #a63d33);
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(166, 61, 51, .07);
      border: 1px solid rgba(166, 61, 51, .18);
      border-radius: 8px;
      display: none;
      line-height: 1.45;
    }

    .error-msg.visible {
      display: block;
    }

    /* === Loading === */
    .loading {
      text-align: center;
      color: var(--text-muted, #6e6559);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .loading.visible {
      display: block;
    }

    /* === Verificación de sesión (estado inicial) === */
    .checking-session {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 2rem 0 1rem;
      color: var(--text-muted, #6e6559);
      font-size: 13.5px;
    }

    .checking-session.visible {
      display: flex;
    }

    .checking-session .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2.5px solid #e6dfd1;
      border-right-color: var(--brand-primary, #6b0000);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* === Honeypot === */
    .honeypot {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* === Prefers reduced motion === */
    @media (prefers-reduced-motion: reduce) {
      .login-input,
      .login-btn,
      .password-toggle {
        transition: none;
      }
      .login-btn .spinner,
      .checking-session .spinner {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <main class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img
          src="/shared/assets/foto_02.png"
          alt="Gallos Mármol"
          class="login-logo-img"
          loading="eager"
          decoding="async"
        >
      </div>

      <h1 class="login-title" id="login-title">Acceso al sistema</h1>
      <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

      <!-- Estado: verificando sesión -->
      <div id="checking-session" class="checking-session" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Verificando sesión…</span>
      </div>

      <!-- Formulario -->
      <form id="login-form" class="login-form" novalidate hidden>
        <!-- Honeypot -->
        <div class="honeypot" aria-hidden="true">
          <label for="login-website">No completar este campo</label>
          <input
            type="text"
            id="login-website"
            name="website"
            tabindex="-1"
            autocomplete="off"
          >
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="field-input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <polyline points="3 7 12 13 21 7"/>
            </svg>
            <input
              class="login-input"
              type="email"
              id="email"
              name="email"
              placeholder="tu@gallosmarmol.com.pe"
              autocomplete="email"
              inputmode="email"
              spellcheck="false"
              required
              autofocus
              aria-required="true"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="field-input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
            <input
              class="login-input has-toggle"
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-required="true"
            >
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
              title="Mostrar contraseña"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-6.5 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button class="login-btn" type="submit" id="btn-login">
          Ingresar
        </button>

        <!-- Feedback -->
        <div id="error-msg" class="error-msg" role="alert" aria-live="assertive"></div>
        <div id="loading" class="loading" aria-live="polite">Verificando credenciales…</div>
      </form>
    </div>
  </main>

  <script type="module">
    import { Auth } from '../shared/js/auth.js';

    // ============================================================
    // DOM
    // ============================================================
    const form = document.getElementById('login-form');
    const checkingSession = document.getElementById('checking-session');
    const errorMsg = document.getElementById('error-msg');
    const loading = document.getElementById('loading');
    const btnLogin = document.getElementById('btn-login');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    const emailInput = document.getElementById('email');
    const honeypot = document.getElementById('login-website');

    // ============================================================
    // RATE LIMIT LOCAL
    // ============================================================
    const INTENTOS_KEY = 'login_intentos';
    const MAX_INTENTOS = 5;
    const COOLDOWN_MS = 30_000;

    function leerIntentos() {
      try {
        const raw = sessionStorage.getItem(INTENTOS_KEY);
        if (!raw) return { count: 0, ts: 0 };
        return JSON.parse(raw);
      } catch {
        return { count: 0, ts: 0 };
      }
    }

    function guardarIntentos(count) {
      try {
        sessionStorage.setItem(INTENTOS_KEY, JSON.stringify({ count, ts: Date.now() }));
      } catch {}
    }

    function resetearIntentos() {
      try {
        sessionStorage.removeItem(INTENTOS_KEY);
      } catch {}
    }

    function bloqueadoPorRateLimit() {
      const { count, ts } = leerIntentos();
      if (count < MAX_INTENTOS) return null;
      const transcurrido = Date.now() - ts;
      if (transcurrido >= COOLDOWN_MS) {
        resetearIntentos();
        return null;
      }
      const restante = Math.ceil((COOLDOWN_MS - transcurrido) / 1000);
      return restante;
    }

    // ============================================================
    // TOGGLE DE CONTRASEÑA
    // ============================================================
    passwordToggle.addEventListener('click', () => {
      const esVisible = passwordInput.type === 'text';
      passwordInput.type = esVisible ? 'password' : 'text';
      passwordToggle.classList.toggle('is-visible', !esVisible);
      passwordToggle.setAttribute('aria-pressed', (!esVisible).toString());
      passwordToggle.setAttribute('aria-label', esVisible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      passwordToggle.setAttribute('title', esVisible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      passwordInput.focus();
    });

    // ============================================================
    // MOSTRAR ERROR / LOADING
    // ============================================================
    function mostrarError(texto) {
      errorMsg.textContent = texto;
      errorMsg.classList.add('visible');
      emailInput.classList.remove('input-error');
      passwordInput.classList.remove('input-error');
    }

    function ocultarError() {
      errorMsg.classList.remove('visible');
      errorMsg.textContent = '';
      emailInput.classList.remove('input-error');
      passwordInput.classList.remove('input-error');
    }

    function setLoading(activo) {
      loading.classList.toggle('visible', activo);
      btnLogin.disabled = activo;
      btnLogin.setAttribute('aria-busy', activo ? 'true' : 'false');
      btnLogin.innerHTML = activo
        ? '<span class="spinner" aria-hidden="true"></span> Ingresando…'
        : 'Ingresar';
    }

    // ============================================================
    // MAPEO DE ERRORES POR CÓDIGO
    // ============================================================
    function traducirError(code, fallback) {
      switch (code) {
        case 'invalid_credentials':
          return 'Correo o contraseña incorrectos.';
        case 'email_not_confirmed':
          return 'Debes confirmar tu correo antes de ingresar.';
        case 'too_many_requests':
        case 'over_request_rate_limit':
          return 'Demasiados intentos. Espera unos minutos.';
        case 'over_email_send_rate_limit':
          return 'Demasiados correos enviados. Intenta más tarde.';
        case 'user_not_found':
          return 'No existe una cuenta con ese correo.';
        case 'email_address_invalid':
          return 'El formato del correo no es válido.';
        default:
          return fallback || 'Error al iniciar sesión. Intenta nuevamente.';
      }
    }

    // ============================================================
    // VALIDACIÓN BÁSICA
    // ============================================================
    function validarFormulario() {
      let ok = true;
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) {
        emailInput.classList.add('input-error');
        ok = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.classList.add('input-error');
        ok = false;
      }

      if (!password) {
        passwordInput.classList.add('input-error');
        ok = false;
      }

      if (!ok) {
        mostrarError('Completa todos los campos correctamente.');
      }
      return ok;
    }

    // ============================================================
    // MOSTRAR FORMULARIO TRAS VERIFICAR SESIÓN
    // ============================================================
    function mostrarFormulario() {
      checkingSession.classList.remove('visible');
      form.hidden = false;
      // Foco en email (el atributo autofocus funciona pero re-forzamos)
      setTimeout(() => emailInput.focus(), 50);
    }

    // ============================================================
    // VERIFICAR SESIÓN ACTIVA AL CARGAR
    // ============================================================
    (async () => {
      try {
        const usuario = await Auth.getUsuarioActual();
        if (usuario) {
          const destino = Auth.getDashboardUrl(usuario.perfil.rol);
          if (destino) {
            window.location.replace(destino);
            return;
          }
          // Si el rol es desconocido, mostrar error
          mostrarFormulario();
          mostrarError(
            `Tu rol "${usuario.perfil.rol || 'desconocido'}" no tiene una página de inicio configurada. Contacta al administrador.`
          );
          await Auth.logout({ redirect: false });
          return;
        }
      } catch (e) {
        // Silencioso: si falla la verificación, mostrar el form igual
        console.warn('[login] verificación de sesión falló:', e?.message || e);
      }
      mostrarFormulario();
    })();

    // ============================================================
    // SUBMIT
    // ============================================================
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      ocultarError();

      // 1. Honeypot
      if (honeypot.value.trim() !== '') {
        // Bot detectado: mensaje genérico y salir
        mostrarError('No se pudo iniciar sesión. Intenta nuevamente.');
        return;
      }

      // 2. Rate limit
      const bloqueadoSeg = bloqueadoPorRateLimit();
      if (bloqueadoSeg !== null) {
        mostrarError(`Demasiados intentos. Espera ${bloqueadoSeg}s antes de volver a intentar.`);
        return;
      }

      // 3. Validación básica
      if (!validarFormulario()) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      setLoading(true);

      try {
        await Auth.login(email, password);
        const usuario = await Auth.getUsuarioActual();

        if (!usuario) {
          resetearIntentos();
          mostrarError(
            'Tu cuenta no está configurada en el sistema. Contacta al administrador.'
          );
          await Auth.logout({ redirect: false });
          return;
        }

        const destino = Auth.getDashboardUrl(usuario.perfil.rol);
        if (!destino) {
          mostrarError(
            `Tu rol "${usuario.perfil.rol || 'desconocido'}" no tiene una página de inicio configurada. Contacta al administrador.`
          );
          await Auth.logout({ redirect: false });
          return;
        }

        resetearIntentos();
        window.location.replace(destino);

      } catch (error) {
        console.error('[login] error:', error?.code || error?.message || error);

        // Contar intento fallido
        const { count } = leerIntentos();
        guardarIntentos(count + 1);

        mostrarError(traducirError(error?.code, error?.message));

      } finally {
        setLoading(false);
      }
    });

    // ============================================================
    // LIMPIAR ERROR AL ESCRIBIR
    // ============================================================
    [emailInput, passwordInput].forEach(input => {
      input.addEventListener('input', () => {
        input.classList.remove('input-error');
        if (errorMsg.classList.contains('visible')) ocultarError();
      });
    });
  </script>

</body>
</html>
