              <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/>
              <rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/>
              <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/>
              <rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/>
            </svg>
          </button>
          <button type="button" id="favoritos-vista-lista" aria-label="Vista en lista" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <rect x="3" y="4" width="18" height="3" rx="1" fill="currentColor"/>
              <rect x="3" y="10.5" width="18" height="3" rx="1" fill="currentColor"/>
              <rect x="3" y="17" width="18" height="3" rx="1" fill="currentColor"/>
            </svg>

        <button type="button" class="btn-vaciar-favoritos" id="btn-vaciar-favoritos" hidden>

    </div>

    <!-- Tabs por origen -->
    <div class="favoritos-tabs" id="favoritos-tabs" role="tablist" hidden></div>

    <!-- Chips por familia -->
    <div class="saldos-familias" id="favoritos-familias" hidden role="group" aria-label="Filtrar por familia"></div>

    <!-- Grid -->
    <div
      class="saldos-productos saldos-productos--grid"
      id="favoritos-grid"
      aria-live="polite"
      role="tabpanel"
      aria-labelledby="favoritos-tabs">
      <!-- Skeleton inicial -->
      <div class="saldos-skeleton-card">
        <div class="saldos-skeleton-media"></div>
        <div class="saldos-skeleton-line saldos-skeleton-line--short"></div>
        <div class="saldos-skeleton-line saldos-skeleton-line--long"></div>
      </div>
      <div class="saldos-skeleton-card">
        <div class="saldos-skeleton-media"></div>
        <div class="saldos-skeleton-line saldos-skeleton-line--short"></div>
        <div class="saldos-skeleton-line saldos-skeleton-line--long"></div>
      </div>
      <div class="saldos-skeleton-card">
        <div class="saldos-skeleton-media"></div>
        <div class="saldos-skeleton-line saldos-skeleton-line--short"></div>
        <div class="saldos-skeleton-line saldos-skeleton-line--long"></div>

</main>

<!-- Modal de confirmación para vaciar -->
<div class="favoritos-modal" id="favoritos-modal-vaciar" role="dialog" aria-modal="true" aria-labelledby="favoritos-modal-title">
  <div class="favoritos-modal__content">
    <h2 class="favoritos-modal__title" id="favoritos-modal-title">¿Vaciar favoritos?</h2>
    <p class="favoritos-modal__text">Se eliminarán todos los productos de tu lista. Esta acción no se puede deshacer.</p>
    <div class="favoritos-modal__actions">
      <button type="button" class="btn btn-ghost" id="favoritos-modal-cancelar">Cancelar</button>
      <button type="button" class="btn btn-primary" id="favoritos-modal-confirmar">Sí, vaciar</button>
    </div>
  </div>
</div>

<script src="../shared/js/shared.js"></script>
<script src="./assets/js/pub-shell.js"></script>
<script src="./assets/js/tracking.js" defer></script>

<script type="module">
import { CatalogoAPI } from '../shared/js/supabase-client.js';
import {
  productCardHtml,
  escapeHtml,
  escapeAttr
} from './assets/js/public.js';

// ============================================================
// SHELL
// ============================================================
pubHeader('catalogo');
if (typeof pubFooter === 'function') pubFooter();

// ============================================================
// ESTADO
// ============================================================
let favoritos = [];            // { sku, origen, fecha }
let productosMap = new Map();  // sku → producto
let items = [];                // { producto, origen, fecha }
let filtros = {
  q: '',
  origen: 'todos',             // 'todos' | 'catalogo' | 'outlet' | 'saldos'
  familia_id: null
};
let vista = 'grid';            // 'grid' | 'lista'

// ============================================================
// DOM
// ============================================================
const $grid = document.getElementById('favoritos-grid');
const $tabs = document.getElementById('favoritos-tabs');
const $familias = document.getElementById('favoritos-familias');
const $searchWrap = document.getElementById('favoritos-search-wrap');
const $search = document.getElementById('favoritos-search');
const $btnVaciar = document.getElementById('btn-vaciar-favoritos');
const $aviso = document.getElementById('favoritos-aviso');
const $vistaGrid = document.getElementById('favoritos-vista-grid');
const $vistaLista = document.getElementById('favoritos-vista-lista');

// ============================================================
// LEER FAVORITOS DEL LOCALSTORAGE (deduplicado)
// ============================================================
function leerFavoritos() {
  try {
    const raw = JSON.parse(localStorage.getItem('favoritos') || '[]');
    if (!Array.isArray(raw)) return [];
    const seen = new Set();
    return raw
      .map(f =>
        typeof f === 'string'
          ? { sku: f, origen: 'catalogo', fecha: null }
          : f
      )
      .filter(f => {
        if (!f || !f.sku) return false;
        const key = `${f.sku}|${f.origen || 'catalogo'}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  } catch (e) {
    return [];
  }
}

// ============================================================
// FECHA "Agregado hace X días"
// ============================================================
function formatearFechaAgregado(fechaISO) {
  if (!fechaISO) return null;
  const fecha = new Date(fechaISO);
  if (isNaN(fecha.getTime())) return null;

  const ahora = new Date();
  const diffMs = ahora - fecha;
  const diffMin = Math.floor(diffMs / (1000 * 60));
  const diffH = Math.floor(diffMs / (1000 * 60 * 60));
  const diffD = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if (diffMin < 1) return 'Agregado ahora';
  if (diffMin < 60) return `Agregado hace ${diffMin} min`;
  if (diffH < 24) return `Agregado hace ${diffH} h`;
  if (diffD === 1) return 'Agregado ayer';
  if (diffD < 7) return `Agregado hace ${diffD} días`;
  if (diffD < 30) {
    const semanas = Math.floor(diffD / 7);
    return `Agregado hace ${semanas} sem`;
  }
  return `Agregado el ${fecha.toLocaleDateString('es-PE', { day: 'numeric', month: 'short' })}`;
}

// ============================================================
// BADGES DE ESTADO
// ============================================================
function renderBadgesEstado(p) {
  const badges = [];
  if (p.activo === false) {
    badges.push(`<span class="favorito-badge favorito-badge--no-disponible">No disponible</span>`);
  } else if (p.stock != null && p.stock <= 5 && p.stock > 0) {
    badges.push(`<span class="favorito-badge favorito-badge--ultima">Últimas unidades (${p.stock})</span>`);
  } else if (p.stock != null && p.stock <= 20 && p.stock > 5) {
    badges.push(`<span class="favorito-badge favorito-badge--stock-bajo">Stock bajo</span>`);
  }
  return badges.length ? `<div class="favorito-badges-estado">${badges.join('')}</div>` : '';
}

// ============================================================
// FILTRAR
// ============================================================
function aplicarFiltros() {
  let visibles = [...items];
  if (filtros.origen !== 'todos') {
    visibles = visibles.filter(it => it.origen === filtros.origen);
  }
  if (filtros.q) {
    const norm = filtros.q.toLowerCase();
    visibles = visibles.filter(it =>
      (it.producto.nombre || '').toLowerCase().includes(norm) ||
      (it.producto.sku || '').toLowerCase().includes(norm)
    );
  }
  if (filtros.familia_id) {
    visibles = visibles.filter(it => it.producto.familia_id === filtros.familia_id);
  }
  return visibles;
}

// ============================================================
// TABS
// ============================================================
function renderTabs() {
  const counts = {
    todos: items.length,
    catalogo: items.filter(it => it.origen === 'catalogo').length,
    outlet: items.filter(it => it.origen === 'outlet').length,
    saldos: items.filter(it => it.origen === 'saldos').length
  };

  const origenes = [
    { key: 'todos', label: 'Todos', count: counts.todos },
    { key: 'catalogo', label: 'Catálogo', count: counts.catalogo },
    { key: 'outlet', label: 'Outlet', count: counts.outlet },
    { key: 'saldos', label: 'Saldos de exportación', count: counts.saldos }
  ].filter(o => o.key === 'todos' || o.count > 0);

  if (origenes.length <= 1) {
    $tabs.hidden = true;
    return;
  }

  $tabs.hidden = false;
  $tabs.innerHTML = origenes.map(o => `
    <button type="button"
            class="favoritos-tab ${filtros.origen === o.key ? 'active' : ''}"
            data-origen="${escapeAttr(o.key)}"
            role="tab"
            aria-selected="${filtros.origen === o.key}">
      ${escapeHtml(o.label)} <span class="tab-count">${o.count}</span>
    </button>
  `).join('');

  $tabs.onclick = (e) => {
    const tab = e.target.closest('.favoritos-tab');
    if (!tab) return;
    filtros.origen = tab.dataset.origen;
    renderTabs();
    renderContenido();
  };
}

// ============================================================
// CHIPS DE FAMILIA
// ============================================================
function renderFamilias() {
  if (items.length <= 15) {
    $familias.hidden = true;
    return;
  }

  const famMap = new Map();
  items.forEach(it => {
    const p = it.producto;
    if (p.familia_id && p.familia_nombre) {
      const prev = famMap.get(p.familia_id);
      famMap.set(p.familia_id, {
        id: p.familia_id,
        nombre: p.familia_nombre,
        count: (prev?.count || 0) + 1
      });
    }
  });

  const familias = Array.from(famMap.values()).sort((a, b) => a.nombre.localeCompare(b.nombre));
  if (familias.length <= 1) {
    $familias.hidden = true;
    return;
  }

  $familias.hidden = false;
  $familias.innerHTML = `
    <button type="button" class="saldos-familia-chip ${!filtros.familia_id ? 'active' : ''}" data-familia="">
      Todas <span class="chip-count">${items.length}</span>
    </button>
    ${familias.map(f => `
      <button type="button"
              class="saldos-familia-chip ${filtros.familia_id === f.id ? 'active' : ''}"
              data-familia="${escapeAttr(f.id)}">
        ${escapeHtml(f.nombre)} <span class="chip-count">${f.count}</span>
      </button>
    `).join('')}
  `;

  $familias.onclick = (e) => {
    const chip = e.target.closest('.saldos-familia-chip');
    if (!chip) return;
    filtros.familia_id = chip.dataset.familia || null;
    renderFamilias();
    renderContenido();
  };
}

// ============================================================
// ESTADO VACÍO (reutilizable)
// ============================================================
const SVG_EMPTY_HEART = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.35-9.5-9.5C1.12 8.55 3.5 5 7 5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.5 0 5.88 3.55 4.5 6.5C19.5 16.65 12 21 12 21z"/></svg>`;
const SVG_EMPTY_FILTER = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="9" y1="11" x2="13" y2="11"/></svg>`;

function renderEstadoVacio(tipo = 'sin-filtros') {
  if (tipo === 'sin-favoritos') {
    $grid.innerHTML = `
      <div class="saldos-empty" style="grid-column:1/-1;">
        <div class="saldos-empty__icon">${SVG_EMPTY_HEART}</div>
        <h3 class="saldos-empty__title">Aún no tienes favoritos</h3>
        <p class="saldos-empty__text">Guarda los productos que te interesen.</p>
      </div>
    `;
    $btnVaciar.hidden = true;
    $tabs.hidden = true;
    $familias.hidden = true;
    $searchWrap.hidden = true;
    $aviso.hidden = true;
    return;
  }

  $grid.innerHTML = `
    <div class="saldos-empty" style="grid-column:1/-1;">
      <div class="saldos-empty__icon">${SVG_EMPTY_FILTER}</div>
      <h3 class="saldos-empty__title">Sin resultados</h3>
      <p class="saldos-empty__text">No se encontraron favoritos con esos filtros.</p>
    </div>
  `;
}

// ============================================================
// RENDER CONTENIDO
// ============================================================
function renderContenido() {
  const visibles = aplicarFiltros();

  $grid.classList.toggle('saldos-productos--grid', vista === 'grid');
  $grid.classList.toggle('saldos-productos--lista', vista === 'lista');

  if (visibles.length === 0) {
    renderEstadoVacio('sin-filtros');
    return;
  }

  $grid.innerHTML = visibles.map(it => {
    const origenLabel = {
      'catalogo': 'Catálogo',
      'outlet': 'Outlet',
      'saldos': 'Saldos de exportación'
    }[it.origen] || it.origen;

    const fechaTexto = formatearFechaAgregado(it.fecha);
    const badgesEstado = renderBadgesEstado(it.producto);

    const cardHtml = productCardHtml(it.producto, true, vista, it.origen, {
      ocultarBadgeLinea: true,
      ocultarBotonFavorito: true
    });

    return `
      <div class="favorito-wrapper" data-sku="${escapeAttr(it.producto.sku)}">
        <div class="favorito-origen-tag">${escapeHtml(origenLabel)}</div>
        ${cardHtml}
        ${badgesEstado}
        ${fechaTexto ? `<div class="favorito-fecha">${escapeHtml(fechaTexto)}</div>` : ''}
      </div>
    `;
  }).join('');
}

// ============================================================
// TOGGLE VISTA (persistente)
// ============================================================
$vistaGrid.addEventListener('click', () => {
  if (vista === 'grid') return;
  vista = 'grid';
  $vistaGrid.classList.add('active');
  $vistaGrid.setAttribute('aria-pressed', 'true');
  $vistaLista.classList.remove('active');
  $vistaLista.setAttribute('aria-pressed', 'false');
  try { localStorage.setItem('favoritos_vista', 'grid'); } catch (e) {}
  renderContenido();
});

$vistaLista.addEventListener('click', () => {
  if (vista === 'lista') return;
  vista = 'lista';
  $vistaLista.classList.add('active');
  $vistaLista.setAttribute('aria-pressed', 'true');
  $vistaGrid.classList.remove('active');
  $vistaGrid.setAttribute('aria-pressed', 'false');
  try { localStorage.setItem('favoritos_vista', 'lista'); } catch (e) {}
  renderContenido();
});

// ============================================================
// BUSCADOR (q capturado antes del setTimeout)
// ============================================================
let searchTimer;
$search.addEventListener('input', (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    filtros.q = q;
    renderContenido();
  }, 250);
});

// ============================================================
// SINCRONIZAR TRAS CLICK EN BOTÓN INTERNO DE FAVORITO
// (porque eliminamos el botón externo)
// ============================================================
$grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-favorito');
  if (!btn) return;
  // El listener de public.js ya ejecutó guardarFavorito
  // Recalculamos después de un tick
  setTimeout(() => sincronizarDesdeLocalStorage(), 0);
});

function sincronizarDesdeLocalStorage() {
  favoritos = leerFavoritos();

  // Reconstruir items solo con los productos ya cargados
  items = favoritos
    .map(fav => {
      const p = productosMap.get(fav.sku);
      if (!p) return null;
      return {
        producto: p,
        origen: fav.origen || 'catalogo',
        fecha: fav.fecha
      };
    })
    .filter(Boolean);

  // Si ya no queda nada
  if (favoritos.length === 0) {
    renderEstadoVacio('sin-favoritos');
    actualizarAvisoNoDisponibles();
    if (window.actualizarContadorFavoritosHeader) window.actualizarContadorFavoritosHeader();
    return;
  }

  // Actualizar controles
  $searchWrap.hidden = items.length <= 10;
  $btnVaciar.hidden = favoritos.length === 0;

  renderTabs();
  renderFamilias();
  renderContenido();
  actualizarAvisoNoDisponibles();

  if (window.actualizarContadorFavoritosHeader) window.actualizarContadorFavoritosHeader();
}

// ============================================================
// MODAL VACIAR (focus trap + Escape)
// ============================================================
const $modal = document.getElementById('favoritos-modal-vaciar');
const $modalCancelar = document.getElementById('favoritos-modal-cancelar');
const $modalConfirmar = document.getElementById('favoritos-modal-confirmar');

let modalFocusReturn = null;

function abrirModalVaciar() {
  modalFocusReturn = document.activeElement;
  $modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $modalCancelar.focus(), 50);
}

function cerrarModalVaciar() {
  $modal.classList.remove('open');
  document.body.style.overflow = '';
  if (modalFocusReturn && typeof modalFocusReturn.focus === 'function') {
    try { modalFocusReturn.focus(); } catch (e) {}
  }
}

function trapFocusModal(e) {
  if (e.key !== 'Tab') return;
  const focusables = $modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusables.length === 0) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

document.addEventListener('keydown', (e) => {
  if (!$modal.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    cerrarModalVaciar();
  } else if (e.key === 'Tab') {
    trapFocusModal(e);
  }
});

$btnVaciar.addEventListener('click', abrirModalVaciar);
$modalCancelar.addEventListener('click', cerrarModalVaciar);

$modalConfirmar.addEventListener('click', () => {
  localStorage.setItem('favoritos', '[]');
  favoritos = [];
  items = [];
  cerrarModalVaciar();
  renderEstadoVacio('sin-favoritos');
  if (window.GM?.toast) window.GM.toast('Favoritos vaciados');
  if (window.actualizarContadorFavoritosHeader) window.actualizarContadorFavoritosHeader();
});

$modal.addEventListener('click', (e) => {
  if (e.target === $modal) cerrarModalVaciar();
});

// ============================================================
// AVISO NO DISPONIBLES
// ============================================================
function actualizarAvisoNoDisponibles() {
  const noDisponibles = favoritos.length - items.length;
  if (noDisponibles > 0) {
    $aviso.innerHTML = `<strong>${noDisponibles} producto${noDisponibles !== 1 ? 's' : ''}</strong> de tu lista ya no está${noDisponibles !== 1 ? 'n' : ''} disponible${noDisponibles !== 1 ? 's' : ''}. Puede que se hayan agotado.`;
    $aviso.hidden = false;
  } else {
    $aviso.hidden = true;
  }
}

// ============================================================
// CARGAR FAVORITOS
// ============================================================
async function cargarFavoritos() {
  favoritos = leerFavoritos();

  // Vista guardada
  try {
    const guardada = localStorage.getItem('favoritos_vista');
    if (guardada === 'lista' || guardada === 'grid') {
      vista = guardada;
      if (vista === 'lista') {
        $vistaLista.classList.add('active');
        $vistaLista.setAttribute('aria-pressed', 'true');
        $vistaGrid.classList.remove('active');
        $vistaGrid.setAttribute('aria-pressed', 'false');
      }
    }
  } catch (e) {}

  // Estado vacío
  if (favoritos.length === 0) {
    renderEstadoVacio('sin-favoritos');
    return;
  }

  // Cargar productos
  let productos = [];
  try {
    productos = await CatalogoAPI.getProductos({});
  } catch (error) {
    console.error('Error cargando productos:', error);
    $grid.innerHTML = `
      <div class="saldos-empty" style="grid-column:1/-1;">
        <div class="saldos-empty__icon">⚠️</div>
        <h3 class="saldos-empty__title">Error al cargar</h3>
        <p class="saldos-empty__text">${escapeHtml(error.message || 'Error desconocido')}</p>
        <button type="button" class="saldos-empty__btn" id="favoritos-btn-retry">Reintentar</button>
      </div>
    `;
    document.getElementById('favoritos-btn-retry')?.addEventListener('click', cargarFavoritos);
    return;
  }

  // Mapa de productos
  productosMap.clear();
  productos.forEach(p => {
    if (!productosMap.has(p.sku)) productosMap.set(p.sku, p);
  });

  // Cruzar con fecha
  items = favoritos
    .map(fav => {
      const p = productosMap.get(fav.sku);
      if (!p) return null;
      return {
        producto: p,
        origen: fav.origen || 'catalogo',
        fecha: fav.fecha
      };
    })
    .filter(Boolean);

  // Controles
  $searchWrap.hidden = items.length <= 10;
  $btnVaciar.hidden = favoritos.length === 0;

  actualizarAvisoNoDisponibles();
  renderTabs();
  renderFamilias();
  renderContenido();

  if (window.actualizarContadorFavoritosHeader) {
    window.actualizarContadorFavoritosHeader();
  }
}

cargarFavoritos();
</script>

</body>
</html>
