<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Productos · Marketing · Gallos Mármol</title>
  <meta name="description" content="Gestión de productos y catálogo público">
  <link rel="stylesheet" href="/shared/css/shared.css">
  <link rel="stylesheet" href="/ventas/assets/css/ventas.css">
</head>
<body data-rol="marketing">

  <div class="ventas-layout">
    <aside class="v-sidebar" id="v-sidebar"></aside>
    <div class="v-main">
      <header class="v-topbar">
        <div class="v-topbar-left">
          <div class="v-crumb" id="v-crumb">Catálogo / Productos</div>
          <h1 class="v-title" id="v-title">Productos</h1>
        </div>
        <div class="v-topbar-right" id="v-topbar-right"></div>
      </header>
      <div class="v-content" id="v-content">
        <div class="v-empty">
          <div class="v-empty-icon">⋯</div>
          <div class="v-empty-text">Cargando…</div>
        </div>
      </div>
    </div>
  </div>

  <!--
    NOTA: Marketing tiene permiso de:
      - productos.ver, productos.crear, productos.editar
      - catalogo.gestionar (gestiona líneas: catálogo/outlet/saldos)
    NO tiene permiso de:
      - productos.eliminar (no ve el botón 🗑)
    Su productos.js muestra:
      - Botón "+ Nuevo producto"
      - Botón ✎ Editar en cada fila
      - Checkboxes de líneas en el modal (catálogo/outlet/saldos)
      - Campos de "precio oferta" por línea
    SIN botón 🗑 (no puede eliminar productos)
  -->

  <script src="/shared/js/shared.js"></script>
  <script type="module" src="/ventas/assets/js/productos.js"></script>
</body>
</html>
