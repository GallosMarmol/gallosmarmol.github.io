<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Leads · Jefe de Ventas · Gallos Mármol</title>
  <meta name="description" content="Gestión y asignación de todos los leads del equipo">
  <link rel="stylesheet" href="/shared/css/shared.css">
  <link rel="stylesheet" href="/ventas/assets/css/ventas.css">
</head>
<body data-rol="jefe">

  <div class="ventas-layout">
    <aside class="v-sidebar" id="v-sidebar"></aside>
    <div class="v-main">
      <header class="v-topbar">
        <div class="v-topbar-left">
          <div class="v-crumb" id="v-crumb">Ventas / Jefe</div>
          <h1 class="v-title" id="v-title">Todos los leads</h1>
        </div>
        <div class="v-topbar-right" id="v-topbar-right"></div>
      </header>
      <div class="v-content" id="v-content">
        <div class="v-empty">
          <div class="v-empty-icon">⋯</div>
          <div class="v-empty-text">Cargando…</div>
        </div>
      </div>
    </div>
  </div>

  <!--
    NOTA: Jefe tiene TODOS los permisos de leads:
      - leads.ver, leads.crear, leads.editar, leads.asignar, leads.eliminar
    Su leads.js muestra:
      - Botón "+ Nuevo lead"
      - Selector de vendedor en cada fila (dropdown editable)
      - Selector de estado en cada fila (dropdown)
      - Filtro por vendedor en el toolbar
      - Date range picker
      - Filtros rápidos: "Sin asignar", "Nuevos esta semana",
        "Sin contactar > 3d", "Convertidos (semana)"
      - Badge en el sidebar con el número de "sin asignar"
  -->

  <script src="/shared/js/shared.js"></script>
  <script type="module" src="/ventas/assets/js/leads.js"></script>
</body>
</html>
