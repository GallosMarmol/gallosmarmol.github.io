<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar · Ventas & CRM · Gallos Mármol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS Compartido -->
    <link rel="stylesheet" href="../shared/css/shared.css">

    <style>
        /* ============================================================
           ESTILOS DE LOGIN - MANTENIENDO PALETA DE CATÁLOGO
           ============================================================ */

        body {
            background: var(--basalt-950, #1a1210);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            font-family: var(--font-body, 'Work Sans', sans-serif);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-panel, #ffffff);
            border-radius: 8px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--vein-gold, #b08d57), var(--brand-primary, #6b0000), var(--vein-gold, #b08d57));
        }

        .login-mark {
            font-family: var(--font-display, 'Fraunces', serif);
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            color: var(--brand-primary, #6b0000);
            margin-bottom: 2px;
        }

        .login-mark span {
            color: var(--vein-gold, #b08d57);
        }

        .login-sub {
            text-align: center;
            color: var(--text-muted, #584038);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .login-card .field {
            margin-bottom: 16px;
        }

        .login-card .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main, #1a1210);
        }

        .login-card .input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-soft, #d4cdbc);
            border-radius: 4px;
            font-size: 14px;
            font-family: var(--font-body, 'Work Sans', sans-serif);
            background: var(--bg-panel, #ffffff);
            color: var(--text-main, #1a1210);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .login-card .input:focus {
            border-color: var(--brand-primary, #6b0000);
            outline: none;
            box-shadow: 0 0 0 3px rgba(107, 0, 0, 0.1);
        }

        .login-card .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-body, 'Work Sans', sans-serif);
        }

        .login-card .btn-primary {
            background: var(--brand-primary, #6b0000);
            color: var(--brand-light, #e8e4d2);
        }

        .login-card .btn-primary:hover {
            background: var(--brand-secondary, #584038);
            transform: translateY(-1px);
        }

        .login-card .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .demo-note {
            background: var(--marble-100, #faf8f4);
            border: 1px dashed var(--border-soft, #d4cdbc);
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-muted, #584038);
            margin-top: 20px;
            text-align: center;
        }

        .demo-note strong {
            color: var(--text-main, #1a1210);
        }

        .login-card .error-msg {
            background: rgba(166, 61, 51, 0.08);
            border: 1px solid var(--danger, #a63d33);
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--danger, #a63d33);
            margin-bottom: 16px;
            display: none;
        }

        .login-card .error-msg.visible {
            display: block;
        }

        .login-card .loading-spinner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted, #584038);
        }

        .login-card .loading-spinner.visible {
            display: flex;
        }

        .login-card .loading-spinner .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-soft, #d4cdbc);
            border-top: 2px solid var(--brand-primary, #6b0000);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-card .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .login-card .back-link a {
            font-size: 12.5px;
            color: var(--text-muted, #584038);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .login-card .back-link a:hover {
            color: var(--brand-primary, #6b0000);
            text-decoration: underline;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
                margin: 10px;
            }

            .login-mark {
                font-size: 20px;
            }

            .login-card .input {
                font-size: 13px;
                padding: 8px 12px;
            }

            .login-card .btn {
                font-size: 14px;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-mark">Gallos <span>Mármol</span></div>
    <div class="login-sub">Portal de Ventas &amp; CRM</div>

    <!-- Mensaje de error -->
    <div class="error-msg" id="error-msg">
        ⚠️ <span id="error-text">Credenciales incorrectas. Intenta nuevamente.</span>
    </div>

    <form id="login-form" autocomplete="off">
        <div class="field">
            <label for="email">Correo corporativo</label>
            <input class="input" id="email" type="email" 
                   placeholder="ejemplo@gallosmarmol.pe" 
                   value="avillar@gallosmarmol.pe" required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input class="input" id="password" type="password" 
                   placeholder="••••••••••" 
                   value="Gallos2026!" required>
        </div>

        <button class="btn btn-primary" id="btn-login" type="submit">
            Ingresar
        </button>

        <div class="loading-spinner" id="loading-spinner">
            <div class="spinner"></div>
            <span>Validando credenciales...</span>
        </div>
    </form>

    <div class="demo-note">
        💡 <strong>Demo:</strong> Usa cualquiera de las credenciales de prueba.
        <br>
        <span style="font-size:11px; color:var(--stone-500);">
            avillar@gallosmarmol.pe / Gallos2026!
        </span>
    </div>

    <div class="back-link">
        <a href="../../familia/index.html">← Volver al catálogo público</a>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPTS -->
<!-- ============================================================ -->
<script src="../shared/js/shared.js"></script>

<script type="module">
    // ============================================================
    // IMPORTACIONES
    // ============================================================
    import { AuthAPI } from '../shared/js/supabase-client.js';

    // ============================================================
    // ELEMENTOS DEL DOM
    // ============================================================
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnLogin = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const loadingSpinner = document.getElementById('loading-spinner');

    // ============================================================
    // FUNCIÓN: MOSTRAR ERROR
    // ============================================================
    function mostrarError(mensaje) {
        errorText.textContent = mensaje;
        errorMsg.classList.add('visible');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Ingresar';
        loadingSpinner.classList.remove('visible');
    }

    // ============================================================
    // FUNCIÓN: OCULTAR ERROR
    // ============================================================
    function ocultarError() {
        errorMsg.classList.remove('visible');
    }

    // ============================================================
    // FUNCIÓN: MOSTRAR LOADING
    // ============================================================
    function mostrarLoading() {
        btnLogin.disabled = true;
        btnLogin.textContent = 'Ingresando...';
        loadingSpinner.classList.add('visible');
        ocultarError();
    }

    // ============================================================
    // FUNCIÓN: VERIFICAR SESIÓN EXISTENTE
    // ============================================================
    async function verificarSesion() {
        try {
            const autenticado = await AuthAPI.isAuthenticated();
            if (autenticado) {
                const userData = await AuthAPI.getCurrentUser();
                if (userData) {
                    const rol = userData.profile?.rol || 'ventas';
                    const dashboardUrl = AuthAPI.getDashboardUrl(rol);
                    window.location.href = dashboardUrl;
                    return true;
                }
            }
            return false;
        } catch (error) {
            console.warn('Error verificando sesión:', error);
            return false;
        }
    }

    // ============================================================
    // EVENTO: ENVÍO DEL FORMULARIO
    // ============================================================
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarError();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        // Validación básica
        if (!email || !password) {
            mostrarError('Por favor, completa todos los campos.');
            return;
        }

        if (!email.includes('@')) {
            mostrarError('Ingresa un correo electrónico válido.');
            return;
        }

        if (password.length < 6) {
            mostrarError('La contraseña debe tener al menos 6 caracteres.');
            return;
        }

        mostrarLoading();

        try {
            const result = await AuthAPI.login(email, password);

            if (result && result.user) {
                const rol = result.profile?.rol || 'ventas';
                const dashboardUrl = AuthAPI.getDashboardUrl(rol);

                // Mostrar mensaje de éxito antes de redirigir
                btnLogin.textContent = '✅ ¡Bienvenido!';
                btnLogin.style.background = 'var(--success, #4d7c53)';

                setTimeout(() => {
                    window.location.href = dashboardUrl;
                }, 800);
            }
        } catch (error) {
            console.error('Error en login:', error);

            let mensaje = 'Error al iniciar sesión. Intenta nuevamente.';

            if (error.message.includes('Invalid login credentials')) {
                mensaje = '❌ Correo o contraseña incorrectos. Verifica tus datos.';
            } else if (error.message.includes('Email not confirmed')) {
                mensaje = '⚠️ Tu correo aún no ha sido confirmado. Revisa tu bandeja de entrada.';
            } else if (error.message.includes('Too many requests')) {
                mensaje = '⏳ Demasiados intentos. Espera unos minutos y vuelve a intentar.';
            }

            mostrarError(mensaje);
        }
    });

    // ============================================================
    // EVENTO: LIMPIAR ERROR AL ESCRIBIR
    // ============================================================
    emailInput.addEventListener('input', ocultarError);
    passwordInput.addEventListener('input', ocultarError);

    // ============================================================
    // EVENTO: ENTER EN CUALQUIER CAMPO
    // ============================================================
    emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });
    passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });

    // ============================================================
    // INICIALIZAR: VERIFICAR SESIÓN EXISTENTE
    // ============================================================
    (async function init() {
        const tieneSesion = await verificarSesion();
        if (tieneSesion) return;

        // Si no hay sesión, mostrar el formulario (ya está visible)
        console.log('🔐 Por favor, inicia sesión para continuar.');
    })();

</script>

</body>
</html>
