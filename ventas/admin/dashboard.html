<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · Administrador · Gallos Mármol</title>
  <meta name="description" content="Panel de control del sistema">
  <link rel="stylesheet" href="/shared/css/shared.css">
  <link rel="stylesheet" href="/ventas/assets/css/ventas.css">
</head>
<body data-rol="admin">

  <div class="ventas-layout">
    <aside class="v-sidebar" id="v-sidebar"></aside>
    <div class="v-main">
      <header class="v-topbar">
        <div class="v-topbar-left">
          <div class="v-crumb" id="v-crumb">Ventas / Admin</div>
          <h1 class="v-title" id="v-title">Dashboard</h1>
        </div>
        <div class="v-topbar-right" id="v-topbar-right"></div>
      </header>
      <div class="v-content" id="v-content">
        <div class="v-empty">
          <div class="v-empty-icon">⋯</div>
          <div class="v-empty-text">Cargando KPIs…</div>
        </div>
      </div>
    </div>
  </div>

  <!--
    NOTA: Admin ve KPIs GLOBALES del sistema:
      - Leads totales + convertidos + tasa global
      - Usuarios activos
      - Productos activos + destacados
      - Distribución por línea (catálogo/outlet/saldos)
      - Últimos leads del equipo
      - Productos destacados
    Acciones rápidas:
      - Ver leads
      - Ver productos
      - Ver usuarios (módulo admin)
    Es el "panel de control" del sistema.
  -->

  <script src="/shared/js/shared.js"></script>
  <script type="module" src="/ventas/assets/js/dashboard-admin.js"></script>
</body>
</html>
