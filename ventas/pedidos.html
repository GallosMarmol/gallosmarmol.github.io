<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pedidos · Gallos Mármol</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared/css/shared.css">
<style>
  #gm-burger{display:none;}
  @media (max-width:880px){ #gm-burger{display:inline-flex;} }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="gm-sidebar"></aside>
  <div class="app-main">
    <header class="app-topbar" id="gm-topbar"></header>
    <main class="app-content" id="gm-content"></main>
  </div>
</div>
<script src="../../shared/js/mock-data.js"></script>
<script src="../../shared/js/shared.js"></script>
<script src="../../shared/js/nav.js"></script>
<script src="../../shared/js/list-page.js"></script>
<script>
gmListPage({
  portal: "ventas",
  active: "pedidos",
  title: "Pedidos",
  crumb: "Ventas",
  base: "../",
  dbKey: "pedidos",
  searchPlaceholder: "Buscar pedido o cliente…",
  subtitle: "Pedidos confirmados enlazados a Almacén: reserva stock, genera despacho y actualiza el kardex.",
  idField: null,
  addLabel: null,
  addFields: null,
  columns: [{key:'id',label:'N° Pedido',mono:true},{key:'cliente',label:'Cliente'},{key:'cotizacion',label:'Cotización origen',mono:true},{key:'fecha',label:'Fecha',mono:true},{key:'entregaEstimada',label:'Entrega est.',mono:true},{key:'total',label:'Total',render:r=>GM.soles(r.total)},{key:'estadoPago',label:'Pago',render:r=>GM.badge(r.estadoPago, GM.estadoTone(r.estadoPago))},{key:'estadoLogistico',label:'Logística',render:r=>GM.badge(r.estadoLogistico, GM.estadoTone(r.estadoLogistico))}]
});
</script>
</body>
</html>
